<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hypertrophy">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>try{var t=localStorage.getItem('hyp-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<title>Hypertrophy Block Tracker</title>
<style>
/* Light: white + red. Dark: black + red. "System" follows the phone (no data-theme attribute). */
:root{--bg:#ffffff;--sf:#ffffff;--tx:#241616;--mu:#7a5f5f;--ln:#f0d9d9;--ac:#c62828;--hd:#fdecec;--on:#ffffff;--ok:#2e7d32;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--sf:#111111;--tx:#f5eaea;--mu:#b39a9a;--ln:#2b1a1a;--ac:#ef5350;--hd:#1c0f0f;--on:#000000;--ok:#66bb6a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--sf:#111111;--tx:#f5eaea;--mu:#b39a9a;--ln:#2b1a1a;--ac:#ef5350;--hd:#1c0f0f;--on:#000000;--ok:#66bb6a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:1.05rem;margin:0 0 8px}
.row{display:flex;gap:6px;margin-bottom:8px}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 6px}
.row button{flex:1}
button.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.info{color:var(--mu);font-size:.85rem;margin:2px 0 10px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:10px}
.card h3{margin:0;font-size:.95rem}
.card h3 small{color:var(--mu);font-weight:400}
.tg{color:var(--ac);font-size:.85rem;margin:3px 0 6px;font-weight:600}
.nt{color:var(--mu);font-size:.78rem;margin-bottom:6px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:6px;margin-bottom:5px;align-items:center}
.set.v{grid-template-columns:22px 1fr 44px}
.set span{color:var(--mu);text-align:center}
.set input{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;text-align:center}
.set .k{padding:8px 0}
.set .k.on{background:var(--ok);border-color:var(--ok);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cw{text-align:center;font-size:.7rem;color:var(--mu)}
.cd{padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.85rem;border-radius:8px;min-height:46px}
.cd small{font-size:.58rem;color:var(--mu);line-height:1}
.cd.pl{background:var(--hd)}
.cd.has{border-color:var(--ok);font-weight:700}
.cd.has small{color:var(--ok)}
.cd.td{border-color:var(--ac)}
.cd.sel{outline:2px solid var(--ac)}
.cd.pn{border-style:dashed;border-color:var(--ac)}
.cd.pn small{color:var(--ac);font-style:italic}
button.dg{color:#e53935;border-color:#e53935}
.sc{overflow-x:auto}
.card h3.xh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dgh{touch-action:none;cursor:grab;padding:2px 10px;font-size:1.2rem;color:var(--mu);user-select:none;-webkit-user-select:none;line-height:1}
.card.drag{opacity:.75;box-shadow:0 8px 20px rgba(0,0,0,.3);outline:2px solid var(--ac)}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:0 10px;align-items:start}
.card{box-shadow:0 1px 2px rgba(0,0,0,.06)}
button{cursor:pointer}
@media(min-width:700px){main{max-width:900px;padding:22px}h1{font-size:1.25rem;margin-bottom:12px}}
.bl{display:flex;gap:6px;margin-bottom:6px}
.bl input[type=text]{flex:1;min-width:0}
.bl2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bl input,.bl select,.bl2 input{box-sizing:border-box;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.bl2 input{width:100%;text-align:center}
label{display:block;font-size:.72rem;color:var(--mu)}
label.ck{display:flex;gap:6px;align-items:center;font-size:.8rem}
.wo{border:2px solid var(--ac);border-radius:12px;padding:8px;margin:12px 0}
.wo .wh input{font-weight:700}
.dh{font-weight:700;color:var(--ac);margin:16px 0 6px;font-size:.9rem;border-bottom:2px solid var(--ac);padding-bottom:3px}
table{border-collapse:collapse;width:100%;font-size:.8rem}
th,td{padding:6px;border-bottom:1px solid var(--ln);text-align:center}
th:first-child,td:first-child{text-align:left}
th{background:var(--hd)}
textarea{width:100%;box-sizing:border-box;height:110px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;font:12px monospace}
p.h{color:var(--mu);font-size:.82rem;margin:8px 0}
</style>
</head>
<body>
<main>
<h1>Hypertrophy block</h1>
<div class="row" id="wk"></div>
<div class="row" id="tabs"></div>
<div id="view"></div>
</main>
<script>
var KEY='hyp-block-v2',OLD='hyp-block-v1',S=null,D=null,tab='W',armed=false;
var WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],MG=['Chest','Back','Shoulders','Rear delts','Biceps','Triceps','Quads','Hamstrings','Glutes','Calves','Abs','Other'];
var MM={inc:'Chest',lat:'Back',lr:'Shoulders',fp:'Rear delts',bp:'Chest',bc:'Biceps',tp:'Triceps',sq:'Quads',rdl:'Hamstrings',row:'Back',le:'Quads',hc:'Hamstrings',sv:'Abs'};
function $(i){return document.getElementById(i)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function gcd(a,b){return b?gcd(b,a%b):a}
function E(id,n,m,sets,lo,hi,st,t,a,u){return{id:id,n:n,m:m,sets:sets,lo:lo,hi:hi,st:st,t:t,a:a,u:u||0}}
function DEF(){return[
{id:'wA',name:'Workout A',ex:[E('inc','Incline DB Press','Chest',2,6,8,2,'Deep stretch; final set to failure.'),E('lat','Lat Pulldown','Back',2,8,10,2.5,'Drive elbows down; stretch at the bottom.','Pull-Up'),E('lr','DB Lateral Raise','Shoulders',3,10,12,1,'Strict form; strip-set the last set.'),E('fp','Face Pull','Rear delts',2,12,15,2.5,'Rear delt contraction and posture.'),E('bp','Flat Bench Press','Chest',2,8,10,2.5,'Lower chest sweep.','Dips'),E('bc','Bicep Curl','Biceps',2,10,12,1,'Superset with pushdown.'),E('tp','Tricep Pushdown','Triceps',2,10,12,2.5,'Superset with curl.')]},
{id:'wB',name:'Workout B',ex:[E('sq','Squat','Quads',2,6,8,5,'Heavy and deep.','Leg Press'),E('rdl','Romanian Deadlift','Hamstrings',2,8,10,5,'Controlled negative.'),E('row','Chest-Supported Row','Back',3,6,8,2.5,'Rest-pause the final set.','T-Bar Row'),E('le','Leg Extension','Quads',2,12,15,2.5,'Drop-set the final set.'),E('hc','Hamstring Curl','Hamstrings',2,10,12,2.5,'Direct hamstring isolation.'),E('sv','Stomach Vacuum','Abs',3,15,20,0,'Reps = seconds. Do at the very end.',undefined,1)]}]}
function mt(x){return{sets:x.sets,lo:x.lo,hi:x.hi,st:x.st,u:x.u||0,a:x.a,t:x.t,m:x.m}}
function allX(){var a=[];S.wos.forEach(function(w){a=a.concat(w.ex)});return a}
function init(){S={days:['Mon','Thu'],wos:DEF(),logs:{},start:{},cur:1};S.rot=S.wos.map(function(w){return w.id});fix()}
function fix(){
 if(!S.lib||!S.meta){S.lib=[];S.meta={}}
 allX().forEach(function(x){if(S.lib.indexOf(x.n)<0)S.lib.push(x.n);if(!S.meta[x.n])S.meta[x.n]=mt(x)});
 if(!S.wlib)S.wlib=clone(S.wos);
 if(!S.rot||!S.rot.length)S.rot=S.wos.map(function(w){return w.id});
 if(!S.cur)S.cur=1;
 if(!S.hist)S.hist=[];
}
function migrate(o){
 var days=o.days||['Mon','Thu'],ord=[],g={},pl=o.plan||[];
 pl.forEach(function(x){var d=o.days?x.s:(x.s=='B'?'Thu':'Mon');x.m=x.m||MM[x.id]||'Other';x._d=d;if(!g[d]){g[d]={id:'w'+d,name:'Workout '+String.fromCharCode(65+ord.length),ex:[]};ord.push(d)}g[d].ex.push(x)});
 var n={days:days,wos:ord.map(function(d){return g[d]}),rot:ord.map(function(d){return g[d].id}),logs:{},start:o.start||{},lib:o.lib,meta:o.meta,cur:((o.wk||1)-1)*days.length+1};
 Object.keys(o.logs||{}).forEach(function(k){var p=k.split('|'),x=pl.filter(function(q){return q.id==p[1]})[0];if(!x)return;var di=days.indexOf(x._d);if(di<0)return;n.logs[((+p[0]-1)*days.length+di+1)+'|'+p[1]]=o.logs[k]});
 pl.forEach(function(x){delete x._d;delete x.s});
 return n;
}
function readLocal(){var o=null;try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!o){try{var o0=JSON.parse(localStorage.getItem(OLD));if(o0&&o0.plan&&o0.plan.length)o=migrate(o0)}catch(e){}}
 return o}
function today(){var t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function applyTheme(){
 var t='system';try{t=localStorage.getItem('hyp-theme')||'system'}catch(e){}
 var r=document.documentElement;if(t=='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);
 document.querySelectorAll('meta[name=theme-color]').forEach(function(m,i){m.setAttribute('content',t=='light'?'#ffffff':t=='dark'?'#000000':(i?'#000000':'#ffffff'))});
}
function boot(){
 applyTheme();
 S=readLocal();
 if(S&&S.wos&&S.wos.length)fix();else init();
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 render();
}
function wo(id){return S.wos.filter(function(w){return w.id==id})[0]||S.wos[0]}
function sess(n){var i=n-1,dl=S.days.length;return{wk:Math.floor(i/dl)+1,day:S.days[i%dl],wo:wo(S.rot[i%S.rot.length])}}
function mxs(){var m=S.cur;Object.keys(S.logs).forEach(function(k){m=Math.max(m,+k.split('|')[0])});return m}
function done(n,x){return(S.logs[n+'|'+x.id]||[]).filter(function(s){return s&&s.d&&s.r!=null})}
function prev(n,x){for(var i=n-1;i>=1;i--){var d=done(i,x);if(d.length)return d}return null}
function sug(n,x){
 var p=prev(n,x);
 if(!p){var s0=S.start[x.id];return s0!=null?{w:s0,r:x.lo}:null}
 var lw=Math.max.apply(null,p.map(function(s){return s.w||0}));
 var at=p.filter(function(s){return(s.w||0)==lw});
 var best=Math.min.apply(null,at.map(function(s){return s.r}));
 var hit=at.every(function(s){return s.r>=x.hi});
 if(hit)return x.st?{w:lw+x.st,r:x.lo}:{w:0,r:best+1};
 return{w:lw,r:Math.min(x.hi,best+1)};
}
function card(x,n){
 var k=n+'|'+x.id,L=S.logs[k]||[],g=sug(n,x),h='';
 h+='<div class="card" data-xid="'+x.id+'"><h3 class="xh"><span>'+esc(x.n)+(x.a?' <small>or '+esc(x.a)+'</small>':'')+'</span><span class="dgh" role="button" aria-label="Drag to reorder" title="Drag to reorder">\u2807</span></h3>';
 h+='<div class="tg">'+(g?('Target '+(x.u?g.r+' s':(g.w+' kg × '+g.r))+' · '+x.sets+' sets'):('Enter a starting weight · '+x.sets+' sets · '+x.lo+'–'+x.hi+' reps'))+'</div>';
 if(x.t)h+='<div class="nt">'+esc(x.t)+'</div>';
 for(var i=0;i<x.sets;i++){
  var s=L[i]||{},d='data-k="'+k+'" data-i="'+i+'" data-x="'+x.id+'"';
  h+='<div class="set'+(x.u?' v':'')+'"><span>'+(i+1)+'</span>';
  if(!x.u)h+='<input type="number" inputmode="decimal" step="any" '+d+' data-f="w" value="'+(s.w==null?'':s.w)+'" placeholder="'+(g?g.w:'kg')+'">';
  h+='<input type="number" inputmode="numeric" '+d+' data-f="r" value="'+(s.r==null?'':s.r)+'" placeholder="'+(g?g.r:(x.u?'sec':'reps'))+'">';
  h+='<button class="k'+(s.d?' on':'')+'" '+d+' data-ok="1" aria-label="Mark set '+(i+1)+' done">✓</button></div>';
 }
 return h+'</div>';
}
function progress(){
 var h='<p class="h">Best set (heaviest weight × reps) each time you did an exercise, oldest to newest, last 6.</p>',M=mxs();
 S.wos.forEach(function(w){
  h+='<div class="dh">'+esc(w.name)+'</div><div class="sc"><table>';
  w.ex.forEach(function(x){
   var r=[];
   for(var n=1;n<=M;n++){var d=done(n,x);if(!d.length)continue;
    var b=d.reduce(function(a,s){return((s.w||0)>(a.w||0)||((s.w||0)==(a.w||0)&&s.r>a.r))?s:a});
    r.push(x.u?b.r+'s':(b.w||0)+'×'+b.r)}
   h+='<tr><td>'+esc(x.n)+'</td><td style="text-align:right">'+(r.length?r.slice(-6).join(' → '):'–')+'</td></tr>';
  });
  h+='</table></div>';
 });
 return h;
}
function more(){
 var th='system';try{th=localStorage.getItem('hyp-theme')||'system'}catch(e){}
 return '<div class="dh">Appearance</div><div class="row">'+[['system','System'],['light','Light'],['dark','Dark']].map(function(t){return '<button data-th="'+t[0]+'" class="'+(th==t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div>'+
 '<p class="h">System follows your phone\u2019s light or dark setting.</p>'+
 '<div class="dh">Your data</div><p class="h">Everything is stored only on this device, in the app\u2019s local storage. Nothing is sent to any server. Export a CSV regularly as a backup.</p>'+
 '<div class="row"><button id="xs">Export all training data (CSV)</button></div><p class="h" id="xmsg"></p>'+
 '<p class="h">Full backup text: copy it to keep a complete copy, or paste a backup here and load it.</p>'+
 '<textarea id="bk">'+esc(JSON.stringify(S))+'</textarea>'+
 '<div class="row" style="margin-top:8px"><button id="ld">Load from box</button></div>'+
 '<div class="dh">Next block</div><p class="h">Finished the block? Choose days, build or reuse workouts, and set the rotation. Your latest weights carry over for exercises you have used before.</p>'+
 '<div class="row"><button id="nm">New block…</button></div>';
}
function csvCell(v){if(v==null)return '';v=String(v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function buildCsv(){
 var rows=[['Block','Session','Week','Day','Date','Workout','Exercise','Muscle','Set','Weight (kg)','Reps','Est. 1RM (kg)','Volume (kg)']];
 (S.hist||[]).concat([S]).forEach(function(b,bi){
  var days=b.days||['?'],dl=days.length,ex={};
  (b.wos||[]).forEach(function(w){w.ex.forEach(function(x){ex[x.id]=[w.name,x]})});
  Object.keys(b.logs||{}).sort(function(a,c){return parseInt(a)-parseInt(c)}).forEach(function(k){
   var p=k.split('|'),n=+p[0],e=ex[p[1]];if(!e)return;
   (b.logs[k]||[]).forEach(function(s,i){
    if(!s||!s.d||s.r==null)return;
    var w=s.w||0,r=s.r;
    rows.push([bi+1,n,Math.floor((n-1)/dl)+1,days[(n-1)%dl],s.dt||'',e[0],e[1].n,e[1].m||'',i+1,w,r,(w>0&&r>0&&r<=12)?Math.round(w*(1+r/30)*10)/10:'',w>0?w*r:'']);
   });
  });
 });
 return rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n')+'\r\n';
}
function exportCsv(){
 var m=$('xmsg');function say(t){if(m)m.textContent=t}
 var name='hypertrophy-training-data-'+today()+'.csv',text='\ufeff'+buildCsv(),file=null;
 try{file=new File([text],name,{type:'text/csv'})}catch(e){}
 function fallback(){
  try{
   var url=URL.createObjectURL(new Blob([text],{type:'text/csv'})),a=document.createElement('a');
   a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();
   setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url)},4000);
   say('Download started. Check your Downloads folder or the Files app.');
  }catch(e){say('Could not export on this device. Use the backup text below instead.')}
 }
 // iOS: the share sheet is the reliable route (Save to Files, then iCloud Drive). Must be called straight from the tap.
 if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
  navigator.share({files:[file],title:name}).then(function(){say('Shared. Choose Save to Files, then iCloud Drive.')},function(er){if(er&&er.name=='AbortError')say('Cancelled.');else fallback()});
 }else fallback();
}
var CAL=null,MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function p2(n){return String(n).padStart(2,'0')}
function calData(){
 var map={};
 (S.hist||[]).concat([S]).forEach(function(b){
  var ex={};(b.wos||[]).forEach(function(w){w.ex.forEach(function(x){ex[x.id]=[w.name,x]})});
  Object.keys(b.logs||{}).forEach(function(k){
   var e=ex[k.split('|')[1]];if(!e)return;
   (b.logs[k]||[]).forEach(function(s){
    if(!s||!s.d||s.r==null||!s.dt)return;
    var d=map[s.dt]=map[s.dt]||{},w=d[e[0]]=d[e[0]]||{},l=w[e[1].n]=w[e[1].n]||{x:e[1],s:[]};
    l.s.push(s);
   });
  });
 });
 return map;
}
function sn(n){return esc(n.split(' ').pop().slice(0,3))}
function planMap(){
 var pm={},lg=0,ld='',n,d=new Date(),i;
 Object.keys(S.logs).forEach(function(k){
  var m=+k.split('|')[0];
  (S.logs[k]||[]).forEach(function(s){if(s&&s.d&&s.r!=null){if(m>lg){lg=m;ld=''}if(m==lg&&s.dt&&s.dt>ld)ld=s.dt}});
 });
 n=lg+1;d.setHours(12,0,0,0);
 if(ld==today())d.setDate(d.getDate()+1);
 for(i=0;i<400;i++){
  if(S.days.indexOf(WD[(d.getDay()+6)%7])>=0){pm[d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())]={n:n,wo:wo(S.rot[(n-1)%S.rot.length])};n++}
  d.setDate(d.getDate()+1);
 }
 return pm;
}
function clearDay(dt){
 [S].concat(S.hist||[]).forEach(function(b){
  Object.keys(b.logs||{}).forEach(function(k){
   var L=b.logs[k],any=false;
   L.forEach(function(s,i){if(s&&s.dt==dt)L[i]={};else if(s&&(s.d||s.w!=null||s.r!=null))any=true});
   if(!any)delete b.logs[k];
  });
 });
}
function calendar(){
 var t=new Date();if(!CAL)CAL={y:t.getFullYear(),m:t.getMonth(),sel:today()};
 var map=calData(),pm=planMap(),off=(new Date(CAL.y,CAL.m,1).getDay()+6)%7,nd=new Date(CAL.y,CAL.m+1,0).getDate(),pre=CAL.y+'-'+p2(CAL.m+1)+'-',cnt=0,pc=0,i;
 Object.keys(map).forEach(function(k){if(k.indexOf(pre)==0)cnt++});
 Object.keys(pm).forEach(function(k){if(k.indexOf(pre)==0&&!map[k])pc++});
 var h='<div class="row"><button data-cm="-1" aria-label="Previous month">‹</button><button class="on" style="flex:3" disabled>'+MN[CAL.m]+' '+CAL.y+'</button><button data-cm="1" aria-label="Next month">›</button></div><div class="cal">';
 WD.forEach(function(d){h+='<div class="cw">'+d+'</div>'});
 for(i=0;i<off;i++)h+='<div></div>';
 for(i=1;i<=nd;i++){
  var key=pre+p2(i),has=map[key],pl=!has&&pm[key];
  h+='<button class="cd'+(has?' has':'')+(pl?' pn':'')+(key==CAL.sel?' sel':'')+(key==today()?' td':'')+'" data-cd="'+key+'">'+i+(has?'<small>'+Object.keys(has).map(sn).join(',')+'</small>':(pl?'<small>'+sn(pl.wo.name)+'</small>':''))+'</button>';
 }
 h+='</div><p class="h">'+cnt+' completed, '+pc+' planned this month. Green = completed, dashed = planned (counting on from your next session).</p>';
 var dt=new Date(CAL.sel+'T00:00:00'),day=map[CAL.sel],p=pm[CAL.sel],ns=0;
 h+='<div class="dh">'+dt.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})+'</div>';
 if(!day&&!p)h+='<p class="h">No workout logged or planned for this day.</p>';
 if(day){
  Object.keys(day).forEach(function(wn){
   h+='<div class="card"><h3>'+esc(wn)+' <small>completed</small></h3>';
   Object.keys(day[wn]).forEach(function(en){
    var l=day[wn][en];ns+=l.s.length;
    h+='<div class="nt" style="margin:6px 0 0"><b style="color:var(--tx)">'+esc(en)+'</b><br>'+l.s.map(function(s){return l.x.u?s.r+'s':(s.w||0)+'×'+s.r}).join(' · ')+'</div>';
   });
   h+='</div>';
  });
  h+='<div class="row"><button class="dg" id="cl">'+(armed?'Tap again to delete '+ns+' logged set'+(ns==1?'':'s'):'Clear this day’s history')+'</button></div>';
 }else if(p){
  h+='<div class="card"><h3>'+esc(p.wo.name)+' <small>planned · session '+p.n+'</small></h3>';
  p.wo.ex.forEach(function(x){
   var g=sug(p.n,x);
   h+='<div class="nt" style="margin:6px 0 0"><b style="color:var(--tx)">'+esc(x.n)+'</b><br>'+x.sets+' × '+x.lo+'–'+x.hi+(x.u?' s':' reps')+(g?' · target '+(x.u?g.r+' s':g.w+' kg × '+g.r):'')+'</div>';
  });
  h+='</div>';
 }
 return h+'<p class="h">Sets logged before dates were recorded do not appear here.</p>';
}
function dwo(id){return D.wos.filter(function(w){return w.id==id})[0]}
function pick(q,n){q.n=n;q.adding=false;var m=S.meta[n];if(m){q.sets=m.sets;q.lo=m.lo;q.hi=m.hi;q.st=m.st;q.u=m.u;q.a=m.a;q.t=m.t;q.m=m.m||q.m}}
function vol(){
 var dl=D.days.length,rl=D.rot.length;
 if(!dl||!rl)return '<p class="h">Choose training days and a rotation to see weekly volume.</p>';
 var cw=rl/gcd(rl,dl),R={},w,j;
 for(w=0;w<cw;w++)for(j=0;j<dl;j++){
  var o=dwo(D.rot[(w*dl+j)%rl]);if(!o)continue;
  o.ex.forEach(function(x){if(!x.n)return;var m=x.m||'Other',n=+x.sets||0;R[m]=R[m]||{t:0};R[m][w]=(R[m][w]||0)+n;R[m].t+=n});
 }
 var ms=Object.keys(R).sort(function(a,b){return R[b].t-R[a].t}),sh=Math.min(cw,4);
 if(!ms.length)return '<p class="h">Add exercises to see weekly volume.</p>';
 var h='<div class="sc"><table><tr><th>Muscle</th>';
 for(w=0;w<sh;w++)h+='<th>'+(cw==1?'Week':'Wk '+(w+1))+'</th>';
 if(cw>1)h+='<th>Avg</th>';
 h+='</tr>';
 ms.forEach(function(m){h+='<tr><td>'+esc(m)+'</td>';for(var w=0;w<sh;w++)h+='<td>'+(R[m][w]||'·')+'</td>';if(cw>1)h+='<td><b>'+(Math.round(R[m].t/cw*10)/10)+'</b></td>';h+='</tr>'});
 return h+'</table></div><p class="h">Sets per muscle in each 7-day week'+(cw>1?'. Your rotation repeats every '+cw+' weeks'+(cw>sh?' (first '+sh+' shown)':''):'')+'. Each exercise counts toward the muscle you assign.</p>';
}
function sel(a,v,list){return '<select '+a+'" style="width:100%">'+list.map(function(o){return '<option'+(o==v?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}
function erow(x,wi,ei){
 var at='data-wi="'+wi+'" data-ei="'+ei+'"',a=at+' data-df="',names=S.lib.slice();
 if(x.n&&names.indexOf(x.n)<0)names.push(x.n);
 names.sort(function(p,q){return p.toLowerCase()<q.toLowerCase()?-1:1});
 var o=names.map(function(n){return '<option value="'+esc(n)+'"'+(n==x.n?' selected':'')+'>'+esc(n)+'</option>'}).join('');
 return '<div class="card"><div class="bl"><select '+a+'n" aria-label="Exercise" style="flex:1;min-width:0"><option value=""'+(x.n?'':' selected')+'>Choose exercise…</option>'+o+'<option value="__new__">+ New exercise…</option></select><button '+at+' data-rm="1" aria-label="Remove exercise">✕</button></div>'+
 (x.adding?'<div class="bl"><input type="text" id="nn'+wi+'_'+ei+'" placeholder="New exercise name" aria-label="New exercise name"><button '+at+' data-addnew="1">Add</button><button '+at+' data-cancelnew="1">Cancel</button></div>':'')+
 '<div class="bl2"><label>Sets<input type="number" inputmode="numeric" '+a+'sets" value="'+x.sets+'"></label><label>Reps from<input type="number" inputmode="numeric" '+a+'lo" value="'+x.lo+'"></label><label>to<input type="number" inputmode="numeric" '+a+'hi" value="'+x.hi+'"></label><label>Step (kg)<input type="number" inputmode="decimal" step="any" '+a+'st" value="'+x.st+'"></label></div>'+
 '<div class="bl" style="margin:8px 0 0;align-items:flex-end"><label style="flex:1">Muscle group'+sel(a+'m',x.m,MG)+'</label><label class="ck" style="margin:0 0 8px"><input type="checkbox" '+a+'u"'+(x.u?' checked':'')+'> Timed (seconds)</label></div></div>';
}
function builder(){
 var dl=D.days.length,rl=D.rot.length,h='<p class="h"><b>1. Training days</b></p><div class="row">';
 WD.forEach(function(d){h+='<button data-day="'+d+'" class="'+(D.days.indexOf(d)>=0?'on':'')+'">'+d+'</button>'});
 h+='</div><p class="h">'+dl+' day'+(dl==1?'':'s')+' per week.</p><p class="h"><b>2. Workouts</b>: build new ones or reuse one from a previous block.</p>';
 D.wos.forEach(function(w,wi){
  h+='<div class="wo"><div class="bl wh"><input type="text" data-wn="'+wi+'" value="'+esc(w.name)+'" aria-label="Workout name"><button data-wd="'+wi+'" aria-label="Delete workout">✕</button></div>';
  w.ex.forEach(function(x,ei){h+=erow(x,wi,ei)});
  h+='<div class="row"><button data-add="'+wi+'">+ Add exercise</button></div></div>';
 });
 h+='<div class="row"><button data-nw="1">+ New workout</button></div>';
 if(S.wlib.length)h+='<div class="bl"><select id="sw" style="flex:1;min-width:0"><option value="">Add a saved workout…</option>'+S.wlib.map(function(w,i){return '<option value="'+i+'">'+esc(w.name)+' ('+w.ex.length+' exercises)</option>'}).join('')+'</select><button data-aw="1">Add</button></div>';
 h+='<p class="h"><b>3. Rotation</b>: workouts are done in this order across your training days, then it repeats. Tap a workout to remove it from the sequence, or add more below.</p><div class="wrap">';
 D.rot.forEach(function(id,i){var o=dwo(id);h+='<button class="on" data-rr="'+i+'">'+esc(o?o.name:'?')+' ✕</button>'});
 h+='</div><div class="wrap" style="margin-top:6px">';
 D.wos.forEach(function(w){h+='<button data-ra="'+w.id+'">+ '+esc(w.name)+'</button>'});
 h+='</div>';
 if(dl&&rl){
  h+='<p class="h">';
  for(var w=0;w<Math.min(2,rl/gcd(rl,dl)+1);w++)h+='Week '+(w+1)+': '+D.days.map(function(d,j){var o=dwo(D.rot[(w*dl+j)%rl]);return d+' '+(o?esc(o.name):'?')}).join(' · ')+'<br>';
  h+='</p>';
 }
 h+='<div class="dh">4. Weekly volume</div><div id="vol">'+vol()+'</div>';
 return h+'<div class="row"><button data-cancel="1">Cancel</button><button class="on" id="go">'+(armed?'Tap again to confirm':'Start block')+'</button></div>';
}
function render(){
 var h='';
 [['W','Workout'],['C','Calendar'],['P','Progress'],['M','More']].forEach(function(q){h+='<button data-tab="'+q[0]+'" class="'+((tab==q[0]||(q[0]=='M'&&tab=='N'))?'on':'')+'">'+q[1]+'</button>'});
 $('tabs').innerHTML=h;
 var w=$('wk'),v='';
 if(tab=='W'){
  var s=sess(S.cur);
  w.style.display='flex';
  w.innerHTML='<button data-n="-1" aria-label="Previous session">‹</button><button class="on" style="flex:3" disabled>Session '+S.cur+' · Wk '+s.wk+' · '+s.day+'</button><button data-n="1" aria-label="Next session">›</button>';
  v='<div class="info"><b>'+esc(s.wo.name)+'</b>. Same sets every session: add a rep each time until every set hits the top of the range, then add weight next session. Drag \u2807 to reorder exercises.</div>';
  v+='<div class="grid">';s.wo.ex.forEach(function(x){v+=card(x,S.cur)});v+='</div>';
 }else{
  w.style.display='none';
  v=tab=='C'?calendar():tab=='P'?progress():(tab=='N'?builder():more());
 }
 $('view').innerHTML=v;
}
document.addEventListener('input',function(e){
 var t=e.target,d=t.dataset;if(!d)return;
 if(d.wn!==undefined){D.wos[+d.wn].name=t.value;return}
 if(d.df){
  var q=D.wos[+d.wi].ex[+d.ei],f=d.df;
  if(f=='n'){if(t.value=='__new__')q.adding=true;else pick(q,t.value);render();return}
  q[f]=t.type=='checkbox'?t.checked:(t.type=='number'?parseFloat(t.value):t.value);
  var vb=$('vol');if(vb)vb.innerHTML=vol();return;
 }
 if(!d.f)return;
 var L=S.logs[d.k]=S.logs[d.k]||[],i=+d.i;
 L[i]=L[i]||{};L[i][d.f]=t.value===''?null:parseFloat(t.value);save();
});
document.addEventListener('change',function(e){if(e.target.dataset&&e.target.dataset.wn!==undefined)render()});
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 var d=b.dataset;
 if(d.n){S.cur=Math.max(1,S.cur+ +d.n);save()}
 else if(d.tab){tab=d.tab;armed=false}
 else if(d.th){try{localStorage.setItem('hyp-theme',d.th)}catch(e){}applyTheme()}
 else if(d.cm){var t2=new Date(CAL.y,CAL.m+ +d.cm,1);CAL.y=t2.getFullYear();CAL.m=t2.getMonth()}
 else if(d.cd){CAL.sel=d.cd;armed=false}
 else if(b.id=='cl'){if(!armed){armed=true}else{clearDay(CAL.sel);save();armed=false}}
 else if(d.ok){
  var L=S.logs[d.k]=S.logs[d.k]||[],i=+d.i,s=L[i]=L[i]||{};
  var x=allX().filter(function(q){return q.id==d.x})[0],g=sug(S.cur,x);
  s.d=!s.d;
  if(s.d){if(s.w==null)s.w=x.u?0:(g?g.w:null);if(s.r==null)s.r=g?g.r:null;s.dt=today()}
  save();
 }
 else if(b.id=='ld'){try{var o=JSON.parse($('bk').value);if(o&&o.wos&&o.logs){S=o;fix();save()}}catch(er){}}
 else if(b.id=='nm'){D={days:S.days.slice(),wos:clone(S.wos),rot:S.rot.slice()};armed=false;tab='N'}
 else if(d.day){var k=D.days.indexOf(d.day);if(k>=0)D.days.splice(k,1);else D.days.push(d.day);D.days=WD.filter(function(z){return D.days.indexOf(z)>=0});armed=false}
 else if(d.nw){var id='w'+Date.now();D.wos.push({id:id,name:'Workout '+String.fromCharCode(65+D.wos.length),ex:[]});D.rot.push(id);armed=false}
 else if(d.aw){
  var sv=$('sw').value;
  if(sv!==''){var c=clone(S.wlib[+sv]);c.id='w'+Date.now();c.ex.forEach(function(q,j){q.id='x'+Date.now()+j});D.wos.push(c);D.rot.push(c.id);armed=false}
 }
 else if(d.wd){var wid=D.wos[+d.wd].id;D.wos.splice(+d.wd,1);D.rot=D.rot.filter(function(z){return z!=wid});armed=false}
 else if(d.ra){D.rot.push(d.ra);armed=false}
 else if(d.rr){D.rot.splice(+d.rr,1);armed=false}
 else if(d.add){D.wos[+d.add].ex.push({id:'x'+Date.now(),n:'',m:'Chest',sets:3,lo:8,hi:12,st:2.5,t:''});armed=false}
 else if(d.rm){D.wos[+d.wi].ex.splice(+d.ei,1);armed=false}
 else if(d.addnew){
  var q2=D.wos[+d.wi].ex[+d.ei],inp=$('nn'+d.wi+'_'+d.ei),nm2=inp?inp.value.trim():'';
  if(nm2){var ex=S.lib.filter(function(n){return n.toLowerCase()==nm2.toLowerCase()})[0];if(!ex){S.lib.push(nm2);ex=nm2}pick(q2,ex);save()}
  else q2.adding=false;
 }
 else if(d.cancelnew){D.wos[+d.wi].ex[+d.ei].adding=false}
 else if(d.cancel){tab='M';armed=false}
 else if(b.id=='go'){
  if(!armed){armed=true}
  else{
   var by={},ns={},np=[];
   allX().forEach(function(x){var p=prev(mxs()+1,x);if(p)by[x.n.toLowerCase()]=Math.max.apply(null,p.map(function(s){return s.w||0}))});
   D.wos.forEach(function(w){
    var ex=[];
    w.ex.forEach(function(q){
     var nm=String(q.n||'').trim();if(!nm)return;
     var lo=Math.max(1,Math.round(q.lo)||8),hi=Math.max(lo,Math.round(q.hi)||12);
     var o={id:q.id,n:nm,a:q.a,t:q.t||'',m:q.m||'Other',sets:Math.max(1,Math.round(q.sets)||3),lo:lo,hi:hi,st:q.u?0:Math.max(0,+q.st||0),u:q.u?1:0};
     ex.push(o);S.meta[nm]=mt(o);if(S.lib.indexOf(nm)<0)S.lib.push(nm);
     var w0=by[nm.toLowerCase()];if(w0!=null)ns[o.id]=w0;
    });
    if(ex.length)np.push({id:w.id,name:String(w.name||'').trim()||'Workout',ex:ex});
   });
   var rot=D.rot.filter(function(z){return np.some(function(w){return w.id==z})});
   if(!rot.length)rot=np.map(function(w){return w.id});
   if(np.length&&D.days.length){
    np.forEach(function(w){var c=clone(w),i=-1;S.wlib.forEach(function(v,j){if(v.name==w.name)i=j});if(i<0)S.wlib.push(c);else S.wlib[i]=c});
    var hist=(S.hist||[]).concat(Object.keys(S.logs).length?[{days:S.days,wos:S.wos,rot:S.rot,logs:S.logs,ended:today()}]:[]);
    S={days:D.days.slice(),wos:np,rot:rot,logs:{},start:ns,cur:1,lib:S.lib,meta:S.meta,wlib:S.wlib,hist:hist};save();tab='W';
   }
   armed=false;
  }
 }
 else if(b.id=='xs'){exportCsv();return}
 else return;
 render();
});
document.addEventListener('keydown',function(e){
 if(e.key!='Enter')return;var t=e.target;
 if(t.dataset&&t.dataset.f){e.preventDefault();var b=document.querySelector('button[data-ok][data-k="'+t.dataset.k+'"][data-i="'+t.dataset.i+'"]');if(b&&!b.classList.contains('on'))b.click()}
});
var DR=null;
document.addEventListener('pointerdown',function(e){
 var h=e.target.closest&&e.target.closest('.dgh');if(!h)return;
 var c=h.closest('.card');if(!c)return;
 e.preventDefault();DR={c:c};c.classList.add('drag');
 try{h.setPointerCapture(e.pointerId)}catch(er){}
});
document.addEventListener('pointermove',function(e){
 if(!DR)return;e.preventDefault();
 var el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.closest?el.closest('.card[data-xid]'):null;
 if(t&&t!==DR.c&&t.parentNode===DR.c.parentNode){
  var r=t.getBoundingClientRect();
  t.parentNode.insertBefore(DR.c,e.clientY>r.top+r.height/2?t.nextSibling:t);
 }
 if(e.clientY<70)window.scrollBy(0,-14);else if(e.clientY>window.innerHeight-70)window.scrollBy(0,14);
});
function endDrag(){
 if(!DR)return;var c=DR.c;DR=null;c.classList.remove('drag');
 var ids=Array.prototype.map.call(c.parentNode.children,function(n){return n.dataset.xid}),w=sess(S.cur).wo;
 w.ex.sort(function(a,b){return ids.indexOf(a.id)-ids.indexOf(b.id)});save();render();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
boot();
</script>
